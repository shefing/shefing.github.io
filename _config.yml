# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Shefing

# This is the place to set up the contact form recipient
email: contact@shefing.com

description: > # this means to ignore newlines until "baseurl:"
 Shefing is an innovative AI transformation agency, delivering production-grade
 AI systems with the governance and human accountability that keep them safe.
keywords: "AI transformation agency, AI consulting, AI strategy, AI software development, AI MVP development, RAG, MCP, agentic workflows, AI governance, LLM gateway, iSDLC, AiTruism, EU AI Act, Israel, Jerusalem"
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://shefing.com" # the base hostname & protocol for your site

# Build settings
markdown: kramdown
# theme: minima
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap

google_analytics: G-NRFWCF1SBG

sass:
  load_paths:
    - bower_components/

incremental: true

exclude: ["gulpfile.js", "Gemfile", "Gemfile.lock", "node_modules", "vendor", "README.md", "Dockerfile", "docker-compose.yml", "*.sh"]

collections:
  works:
    output: true
    permalink: /portfolio/:name/

defaults:
  - scope:
      path: ""
      type: works
    values:
      layout: work
      sitemap: false
      noindex: true
  - scope:
      path: ""
      type: posts
    values:
      sitemap: false
      noindex: true
  - scope:
      path: "bower_components"
    values:
      sitemap: false

paginate: 4
paginate_path: "/blog/page/:num"
# This is the place to set up the commenting system
# disqus:
#   shortname: your-disqus-shortname

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
