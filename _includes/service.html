<div class="svc-card" style="background-image: url('{{ include.service.bg | relative_url }}');">
  <div class="svc-card-inner">
    <p class="svc-tag">{{ include.service.tag | escape }}</p>
    <img class="svc-icon" src="{{ include.service.icon | relative_url }}" alt="">
    <h3>{{ include.service.title | escape }}</h3>
    <p class="svc-tagline">{{ include.service.tagline | escape }}</p>
    <ul class="svc-points">
      {% for pt in include.service.points %}
      <li><strong>{{ pt.lead | escape }}.</strong> {{ pt.text | escape }}</li>
      {% endfor %}
    </ul>
  </div>
</div>
